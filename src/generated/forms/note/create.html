<form
  data-entity="note"
  data-mutation="create"
  data-action="/api/notes/create"
  hidden
>
  <h3>Create</h3>
  <p>Add a note.</p>
  <label>
    Title
    <input name="title" type="text" required>
  </label>
  <label>
    Body
    <input name="body" type="text" required>
  </label>
  <button type="submit">Create</button>
</form>
